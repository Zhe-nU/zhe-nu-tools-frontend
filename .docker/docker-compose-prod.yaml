services:
  frontend:
    build:
      context: ./..
      dockerfile: ./.docker/dockerfile.prod
      args:
        - NEXT_PUBLIC_AVITO_CLIENT_ID=${NEXT_PUBLIC_AVITO_CLIENT_ID}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_FORGOT_PASSWORD_REDIRECT_URL=${NEXT_PUBLIC_FORGOT_PASSWORD_REDIRECT_URL}
        - NEXT_PUBLIC_LOGIN_REDIRECT_URL=${NEXT_PUBLIC_LOGIN_REDIRECT_URL}
        - NODE_ENV=production
    ports:
      - "8080:3000"
